<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- The PompDash mark: a "P" with a dash trailing from its bowl, in Tokyo Night
       blue (#7aa2f7) and purple (#bb9af7) on its night background (#1a1b26).
       The home-screen icons beside this file are the same shape. Change the
       mark and re-run `scripts/generate_icons.py`, which draws the raster
       copies; the palette is the dark theme's, in web/templates/_theme.html. -->
  <rect width="128" height="128" rx="26" ry="26" fill="#1a1b26"/>
  <rect x="34" y="22" width="18" height="84" rx="9" fill="#7aa2f7"/>
  <circle cx="70" cy="52" r="21" fill="none" stroke="#7aa2f7" stroke-width="18"/>
  <rect x="62" y="94" width="38" height="12" rx="6" fill="#bb9af7"/>
</svg>
