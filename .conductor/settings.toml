"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# Workspaces may share a copied configuration.
run_mode = "nonconcurrent"

# The development requirements cover the app and tests.
setup = """
set -e
python3 -m venv venv
venv/bin/pip install -q -r requirements-dev.txt
[ -f config.yaml ] || cp config.example.yaml config.yaml
venv/bin/python sample_board.py
"""

# dev.py supervises the Flask app.
[scripts.run.dev]
command = "venv/bin/python dev.py"
default = true
icon = "play"

[scripts.run.generate]
command = "venv/bin/python generate.py"
icon = "sparkles"
