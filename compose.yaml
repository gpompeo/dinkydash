services:
  web:
    image: ghcr.io/gpompeo/pompdash:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      DINKYDASH_CONFIG: /data/config.yaml
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DINKYDASH_MODE: ${DINKYDASH_MODE:-single}
      DINKYDASH_PARENT_PASSWORD: ${DINKYDASH_PARENT_PASSWORD:-}
      DINKYDASH_SECRET_KEY: ${DINKYDASH_SECRET_KEY:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      DINKYDASH_MAIL_FROM: ${DINKYDASH_MAIL_FROM:-}
      DINKYDASH_MAIL_REPLY_TO: ${DINKYDASH_MAIL_REPLY_TO:-}
      DINKYDASH_FEEDBACK_TO: ${DINKYDASH_FEEDBACK_TO:-}
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data

  worker:
    image: ghcr.io/gpompeo/pompdash:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      DINKYDASH_CONFIG: /data/config.yaml
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DINKYDASH_MODE: ${DINKYDASH_MODE:-single}
    command:
      - sh
      - -c
      - while true; do python generate.py --tick; sleep 300; done
    volumes:
      - ./data:/data
